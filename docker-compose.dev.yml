version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: research_papers
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - postgres
    env_file:
      - docker.env
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./sample_papers:/app/sample_papers
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  qdrant_storage:
  postgres_data:
