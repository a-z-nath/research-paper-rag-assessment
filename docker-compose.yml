version: "3.8"

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: research_papers
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI Application
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - postgres
    env_file:
      - docker.env
    volumes:
      - ./uploads:/app/uploads
      - ./sample_papers:/app/sample_papers

volumes:
  qdrant_storage:
  postgres_data:
